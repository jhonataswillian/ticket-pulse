spring:
  application:
    name: ticketpulse

  datasource:
    url: jdbc:postgresql://localhost:5433/ticketpulse
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin_password
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 5
          multiplier: 1.0

logging:
  level:
    org.springframework.web: INFO