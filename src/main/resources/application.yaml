spring:
  application:
    name: ticketpulse

  datasource:
    url: jdbc:postgresql://localhost:5432/ticketpulse
    username: admin
    password: admin_password

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin_password

logging:
  level:
    org.springframework.web: INFO