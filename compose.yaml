services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketpulse-db
    environment:
      POSTGRES_DB: ticketpulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ticketpulse-net

  redis:
    image: redis:7-alpine
    container_name: ticketpulse-redis
    ports:
      - "6379:6379"
    networks:
      - ticketpulse-net

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: ticketpulse-mq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin_password
    networks:
      - ticketpulse-net

volumes:
  postgres_data:

networks:
  ticketpulse-net:
    driver: bridge